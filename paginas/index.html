<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather now</title>
    <link rel="stylesheet" href="../styles/index.css">
    <script src="/scripts/index.js" type="module" defer></script>
</head>
<body>
    <header>
        <p>🌥️Weather now</p>
        <button>Units</button>
    </header>

    <nav id="busca">
        <h1>How's the sky looking today?</h1>
        <form action="" >
            <input type="text" placeholder="Search for a place...">
            <button type="submit">Search</button>
        </form>
    </nav>

    <main>
        <div id="secao-equerda">
            <section id="clima-hoje">
                <div id="clima-momento">
                    <p id="city"></p>
                    <p id="temp-momento"></p>
                </div>
                <section id="detalhar">
                    <div id="sensacao">
                        <p class="titulo">Feels like</p>
                        <p id="v-sensacao"></p>
                    </div>
                    <div id="umidade">
                        <p class="titulo">Humidity</p>
                        <p id="v-umidade"></p>
                    </div>
                    <div id="vento">
                        <p class="titulo">Wind</p>
                        <p id="v-vento"></p>
                    </div>
                    <div id="precipitacao">
                        <p class="titulo">Precipitation</p>
                        <p id="v-precipitacao"></p>
                    </div>
                </section>   
            </section>
            <section id="clima-semana">
                <P>Daily forecast</P>
                <div id="semana">
                </div>
            </section>
        </div>
        <aside id="clima-hora">
            <div id="horario">
                <p>Hourly forecast</p>
                <p>Tuesday</p>
            </div>
        </aside>
    </main>

</body>
</html>
